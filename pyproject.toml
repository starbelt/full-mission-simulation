[project]
name = "pocketadcs-sim"
version = "0.1.0"
description = "Simulation environment for evaluating a PocketQube attitude determination system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ahrs>=0.4,<0.5",
    "astropy>=7.0",
    "bsk==2.11.1",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "ppigrf==2.1.0",
    "pymap3d>=3.2",
    "pyserial>=3.5",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketadcs_sim"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pocketadcs_sim"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ahrs.*", "astropy.*", "Basilisk.*", "ppigrf.*", "pymap3d.*", "scipy.*"]
ignore_missing_imports = true

