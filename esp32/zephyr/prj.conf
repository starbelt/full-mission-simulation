CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL_ESP32_USB=y
# Required for the host->board direction on this console. Without
# CONFIG_UART_LINE_CTRL the USB-Serial/JTAG driver does not bring up its CDC
# line-state/control path, so the PC enumerates the device and can read the
# heartbeat (device->host works) but every host write stalls in the driver with
# a write timeout (host->device never arrives). The AIO PocketQube Zephyr
# project hits the same console and sets this; our config was missing it.
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CPP=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_MAIN_STACK_SIZE=4096
