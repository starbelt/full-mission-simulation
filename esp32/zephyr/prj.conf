CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL_ESP32_USB=y
# Match the working AIO Zephyr console configuration. This option is not a
# proven fix for host write timeouts: the ESP32 USB-Serial/JTAG driver's RX
# implementation does not use UART line-control callbacks. Host programs
# must configure DTR/RTS before opening the port to avoid a control-line pulse.
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CPP=y
CONFIG_PICOLIBC_IO_FLOAT=y
# Xtensa -Os stack-usage audit: main -> references -> igrfFieldGcrs ->
# igrfFieldItrs -> legendreSchmidt needs at least 9488 bytes, before libm
# and runtime overhead. A 4096-byte main stack corrupts memory on this path.
CONFIG_MAIN_STACK_SIZE=16384
# Detect stack damage and retain high-water accounting in non-diagnostic builds.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
